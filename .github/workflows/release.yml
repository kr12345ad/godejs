name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-amd64:
    # Ubuntu 24.04 dropped the JavaScriptCore GTK 4.0 development package.
    # GodeJS links libjavascriptcoregtk-4.0.so.18, so build on 22.04.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install JavaScriptCore
        run: |
          sudo apt-get update
          sudo apt-get install -y libjavascriptcoregtk-4.0-dev

      - name: Build release binary
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -ldflags="-s -w" \
            -o dist/gode-linux-amd64 ./cmd/gode
          cd dist
          sha256sum gode-linux-amd64 > gode-linux-amd64.sha256

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: gode-linux-amd64
          path: dist/*
          if-no-files-found: error

  darwin:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binary
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -ldflags="-s -w" \
            -o dist/gode-darwin-${{ matrix.arch }} ./cmd/gode
          cd dist
          shasum -a 256 gode-darwin-${{ matrix.arch }} \
            > gode-darwin-${{ matrix.arch }}.sha256
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            ./gode-darwin-arm64 -e "console.log(process.version)"
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: gode-darwin-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [linux-amd64, darwin]
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: gode-*
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
