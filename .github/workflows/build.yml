name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-amd64:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install JavaScriptCore
        run: |
          sudo apt-get update
          sudo apt-get install -y libjavascriptcoregtk-4.0-dev

      - name: Build
        run: CGO_ENABLED=1 go build ./cmd/gode

  darwin:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: CGO_ENABLED=1 GOARCH=${{ matrix.arch }} go build ./cmd/gode

      - name: Verify architecture
        run: |
          want=arm64
          if [ "${{ matrix.arch }}" = "amd64" ]; then want=x86_64; fi
          lipo -archs ./gode | grep -qw "$want"

      - name: Smoke test
        if: matrix.arch == 'arm64'
        run: ./gode -e "console.log(process.version)"
